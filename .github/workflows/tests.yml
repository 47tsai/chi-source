name: Test AltStore Source

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile update_source.py validate_source.py test_update_source.py test_validate_source.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate current source
        run: python validate_source.py
